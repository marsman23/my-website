<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Name - YouTuber</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #121212;
      color: #fff;
      text-align: center;
      padding: 50px;
    }

    h1 {
      color: #ff0000;
      font-size: 3rem;
    }

    .intro {
      font-size: 1.2rem;
      margin-bottom: 30px;
    }

    a.youtube-button {
      display: inline-block;
      background-color: #ff0000;
      color: white;
      text-decoration: none;
      padding: 15px 25px;
      border-radius: 5px;
      font-size: 1.1rem;
      transition: background-color 0.3s;
    }

    a.youtube-button:hover {
      background-color: #e60000;
    }

    footer {
      margin-top: 50px;
      font-size: 0.9rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <h1>Welcome to My Website</h1>
  <p class="intro">I'm a content creator on YouTube. Check out my latest videos and subscribe for more!</p>

  <a class="youtube-button" href="https://www.youtube.com/" target="_blank">
    📺 Visit My YouTube Channel
  </a>

  <footer>
    <p>© 2025 Your Name. All rights reserved.</p>
  </footer>
</body>
</html>
